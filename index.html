<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- SEO & Metadata -->
    <title>TripVault — Intelligent Travel & Tourism Companion</title>
    <meta name="description" content="TripVault — Capture every moment of your journey. AI-powered itineraries, expense tracking, packing checklists, real-time weather, and private travel journaling." />
    <meta name="keywords" content="travel planner, itinerary builder, travel budget tracker, travel journal, trip assistant, AI travel planner" />
    <meta name="author" content="TripVault" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TripVault — Intelligent Travel & Tourism Companion" />
    <meta property="og:description" content="Plan smarter itineraries, track budgets effortlessly, check live destination forecasts, and preserve memories with TripVault." />
    <meta property="og:site_name" content="TripVault" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TripVault — Intelligent Travel & Tourism Companion" />
    <meta name="twitter:description" content="Plan smarter itineraries, track budgets effortlessly, check live destination forecasts, and preserve memories with TripVault." />

    <!-- Mobile & PWA Theme -->
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
