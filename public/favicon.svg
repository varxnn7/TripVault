<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f13"/>
      <stop offset="100%" stop-color="#1a1a24"/>
    </linearGradient>
    <!-- Purple accent gradient -->
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded dark background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle inner border glow -->
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#a855f7" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Suitcase body -->
  <rect x="12" y="22" width="40" height="30" rx="4" fill="url(#purple)" filter="url(#glow)"/>

  <!-- Suitcase body highlight (glassmorphism sheen) -->
  <rect x="12" y="22" width="40" height="12" rx="4" fill="white" fill-opacity="0.08"/>

  <!-- Suitcase divider line (horizontal) -->
  <line x1="12" y1="37" x2="52" y2="37" stroke="white" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Suitcase handle -->
  <path d="M24 22 L24 17 Q24 14 27 14 L37 14 Q40 14 40 17 L40 22"
        fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lock / clasp in center -->
  <rect x="28.5" y="34" width="7" height="5.5" rx="1.5" fill="white" fill-opacity="0.9"/>
  <path d="M30 34 L30 32.5 Q30 30.5 32 30.5 Q34 30.5 34 32.5 L34 34"
        fill="none" stroke="white" stroke-opacity="0.9" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Small dot on lock -->
  <circle cx="32" cy="36.8" r="0.8" fill="#7c3aed"/>

  <!-- Subtle corner rivets -->
  <circle cx="15.5" cy="25" r="1" fill="white" fill-opacity="0.2"/>
  <circle cx="48.5" cy="25" r="1" fill="white" fill-opacity="0.2"/>
  <circle cx="15.5" cy="49" r="1" fill="white" fill-opacity="0.2"/>
  <circle cx="48.5" cy="49" r="1" fill="white" fill-opacity="0.2"/>

  <!-- Bottom wheels -->
  <circle cx="20" cy="53" r="2.2" fill="#2d2d3d" stroke="#a855f7" stroke-opacity="0.6" stroke-width="1"/>
  <circle cx="44" cy="53" r="2.2" fill="#2d2d3d" stroke="#a855f7" stroke-opacity="0.6" stroke-width="1"/>
</svg>