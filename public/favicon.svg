<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tvDiamondBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e11"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>

    <!-- Diamond Facet / Gradient -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0f2f5"/>
      <stop offset="100%" stop-color="#b0b5be"/>
    </linearGradient>

    <!-- Inner Shadow & Subtle Glow -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ffffff" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base Container for Dark & Light Browser Tabs -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#tvDiamondBg)" stroke="#222226" stroke-width="8"/>

  <!-- Iconic TripVault Diamond ◆ -->
  <g filter="url(#subtleGlow)">
    <polygon 
      points="256,92 420,256 256,420 92,256" 
      fill="url(#diamondGrad)"
    />
  </g>
</svg>